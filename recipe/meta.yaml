{% set version = "8.8.2" %}
{% set protoc_version = "35.1" %}
{% set base_url = "https://github.com/bazelbuild/bazel/releases/download" %}

package:
  name: bazel
  version: {{ version }}

source:
  - url: {{ base_url }}/{{ version }}/bazel-{{ version }}-dist.zip
    sha256: d14a2e18a02a1d50ef06ba5fdcf636587d595b41e1661903cfce916df43284a0
    patches:
      # bazel depends on https://github.com/conda-forge/singlejar-feedstock to build,
      # which patches the same sources; the patches from singlejar should either be
      # taken over here, or synced back if change is necessary
      - patches/0001-allow-args-to-be-passed-to-bazel_build.patch  # [unix]
      - patches/0002-Build-with-native-dependencies.patch          # [unix]
      - patches/0003-use-C-17.patch                                # [unix]
      - patches/0004-Use-conda-packages-for-build-tools.patch      # [unix]
      - patches/0005-grpc-java-plugin-from-build.patch             # [unix]
      - patches/0006-bazel-bin-loader-path.patch                   # [osx]
      - patches/0007-Adjust-cross-bazel-resultpath.patch           # [unix]
      - patches/0008-Install-protobuf-via-maven.patch              # [unix]
      - patches/0009-Adopt-system-libprotobuf.patch                # [unix]
      - patches/0010-Enable-new-protobuf-major-release.patch       # [unix]
      - patches/0011-Add-missing-absl-dependency.patch             # [unix]
      - patches/0012-avoid-linking-to-grpc-_unsecure-use-regular-variant-.patch     # [unix]
      - patches/0013-bump-MODULE.bazel-direct-deps-for-MVS.patch          # [unix]
      - patches/0014-use-ProtoInfo.transitive_sources.patch               # [unix]
      - patches/0015-Link-against-the-system-zlib.patch                   # [unix]
  # Used as the bootstrap for both win-64 and win-arm64; see recipe/build_win.sh
  # for why the x86_64 binary is also used for the arm64 build.
  - url: {{ base_url }}/{{ version }}/bazel-{{ version }}-windows-x86_64.exe  # [win]
    sha256: 07e467a78e709a4c9b0dca13da15121b4fcd7c6a037dfb4b17c72e527d4d6785  # [win]

build:
  number: 0
  # Still have a problem with signing binaries on windows, will be released manually
  skip: true  # [win]
  ignore_prefix_files: true
  binary_relocation: false

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - msys2-sed                # [win]
    - sed                      # [unix]
    - openjdk 21.*             # [unix]
    # we need $BUILD_PREFIX/bin/{grpc_cpp_plugin,grpc_java_plugin,protoc}
    # Stage 003 rebuilt 1.78.0 against libprotobuf 7.35.1; drop the old <1.74 ceiling
    - grpc_java_plugin 1.78.*  # [unix]
    - libgrpc {{ libgrpc }}           # [unix]
    - libprotobuf {{ libprotobuf }}       # [unix]
    - ijar {{ version }}       # [unix]
    - singlejar {{ version }}  # [unix]
    - bazel-toolchain >=0.2.0,<0.5.0  # [unix]
    - zip                      # [linux]
    - unzip                    # [linux]
    - python *                 # [win]
  host:
    - libabseil {{ libabseil }}          # [unix]
    - libgrpc {{ libgrpc }}                  # [unix]
    - libprotobuf {{ libprotobuf }}              # [unix]
    - zlib {{ zlib }}                 # [unix]
    # ships bazel/ and upb/ for grpc's build rules
    - protobuf-bazel-rules >=35.1     # [unix]
    - openjdk 25.*                    # [win]
    - msys2-posix 1                   # [win]
  run:
    - openjdk >=21
    - msys2-posix              # [win]
    - ijar {{ version }}       # [unix]
    - singlejar {{ version }}  # [unix]

test:
  requires:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - bazel-toolchain >=0.2,<0.5.0  # [unix]
  commands:
    - bazel -h
    - bazel version
    # Windows-only: `bazel --version` is answered by the client alone, printing
    # "bazel <build-label>" from the embedded build-label.txt. This fails if the
    # label is missing (package-bazel.sh's "no_version" fallback), which happens
    # when build_win.sh forgets --stamp/--embed_label.
    - bazel --version | findstr /C:"bazel {{ version }}"  # [win]
    - bazel --version | grep -F "bazel {{ version }}"  # [unix]

about:
  home: https://bazel.build
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: build system originally authored by Google
  description: |
    Bazel is Google's own build tool, now publicly available in Beta. Bazel has
    built-in support for building both client and server software, including
    client applications for both Android and iOS platforms. It also provides an
    extensible framework that you can use to develop your own build rules.
  dev_url: https://github.com/bazelbuild/bazel
  doc_url: https://bazel.build/docs

extra:
  skip-lints:
    - msys2_must_be_in_build  # The build tool posix is not in the build section.
    - has_run_test_and_commands
  recipe-maintainers:
    - h-vetinari
    - nehaljwani
    - abhi18av
    - jschueller
    - adrianchia
    - xhochy
